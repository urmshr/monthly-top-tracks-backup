name: Monthly 50 Tracks Backup

on:
  schedule:
    # 1st of every month, 00:17 local time: back up the previous month.
    # Off the top of the hour to avoid GitHub's scheduler peak.
    - cron: "17 0 1 * *"
      timezone: "Asia/Tokyo" # Keep in sync with env.TZ below.
  workflow_dispatch:

env:
  # Decides which month is "the previous month". Keep in sync with the schedule timezone above.
  TZ: Asia/Tokyo

jobs:
  backup:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run script
        env:
          SPOTIPY_CLIENT_ID: ${{ secrets.SPOTIPY_CLIENT_ID }}
          SPOTIPY_CLIENT_SECRET: ${{ secrets.SPOTIPY_CLIENT_SECRET }}
          SPOTIPY_REDIRECT_URI: ${{ secrets.SPOTIPY_REDIRECT_URI }}
          SPOTIPY_REFRESH_TOKEN: ${{ secrets.SPOTIPY_REFRESH_TOKEN }}
        run: python main.py
